spring:
  application:
    name: mingo-chatapp

  data:
    mongodb:
      uri: ${MONGODB_URI}

server:
  address: 0.0.0.0
  port: 8081

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}